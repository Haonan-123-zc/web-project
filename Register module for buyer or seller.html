<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car sale - Log in</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
      /* initialize the layout */
      body {
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        /* make sure zooming in the page won't influence the display of the page */
        
         .container {
            width: 100%;
            max-width: 600px;
            background-color: whitesmoke;
            padding: 35px;
            border-radius: 12px;
        }
      /* style of main container */

      h1 {
            text-align: center;
            color: midnightblue;
            margin-bottom: 25px;
            font-size: 24px;
        }
        /* style of main title */

        .role-tabs {
            display: flex;
            border-bottom: 1px solid white;
        }
       
        .tab-btn {
            flex: 1;
            padding: 12px 0;
            border: none;
            background-color: white;
            cursor: pointer;
            font-size: 16px;
            color:dimgrey;
            transition: all 0.3s ease;
        }
        /* style of buttom title */

        .tab-btn.active {
            color: dodgerblue;
            border-bottom: 3px solid dodgerblue;
            font-weight: bold;
        }
        /* style of the button when it is clicked */
       
         .form-wrapper {
            padding: 30px;
        }

        /* when switching from the one to the other,former must be blocked */
        .register-form {
            display: none;
        }

       
        .register-form.active {
            display: block;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color:black;
            font-weight: 500;
            font-size: 14px;
        }
        /* style of form label */

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid white;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        /* style of form input*/

        .msg-tip.success {
            color: green
        }
         /* style of successful feedback */

        .error-tip {
            display: block;
            color:red;
            font-size: 12px;
            margin-top: 4px;
            min-height: 16px;
        }
         /* style of error feedback */

         .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

         .submit-btn {
            width: 100%;
            padding: 14px;
            background-color: dodgerblue;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .submit-btn:hover {
            background-color: dodgerblue;
        }

        .submit-btn:disabled {
            background-color: lightgray;
            cursor: not-allowed;
        }
 




    </style>

</head>

<body>
    <div class="container">
        <h1>Car sale - Register module</h1>

        <div class="tab-container">
            <button class="tab-btn active" data-type="buyer">Buyer</button>
            <button class="tab-btn" data-type="seller">Seller</button>
        </div>
        <!-- buyer/seller switch button -->

         <div class="form-wrapper">
             
            <!-- for buyer-->
             <form class="register-form active" id="buyerForm">

         <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required placeholder="Please type your name">
            </div>
             <!-- name input -->

            <div class="form-group">
                <label for="address">Address</label>
                <input type="text" id="address" name="address" required placeholder="Please type your address">
            <!-- addressd input -->

            <div class="form-group">
                <label for="phone">Phone number</label>
                <input type="tel" id="phone" name="phone" required placeholder="Please type your 11 digits Chinese phone number">
            </div> 
            <!--phone number -->

            <div class="form-group">
                <label for="email">Emial address</address></label>
                <input type="email" id="email" name="email" required placeholder="Please type your email address">
            </div>
            <!-- email address -->

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required placeholder="You shall type at least 6 alphanumeric characters ">
            </div>
             <!-- username -->

             <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"  required placeholder="You shall type at least 6 alphanumeric characters">
            </div>
             <!-- password -->

              <div class="form-group">
                <label for="confirm your password">Confirm your password</label>
                <input type="password" id="repassword" name="confirm your password" required placeholder="Please type your password again">
            </div> 
            <!-- confirm password -->
                <button type="submit" class="submit-btn">You have finished registration</button>
            </form>

             <form class="register-form" id="sellerForm">
                 <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required placeholder="Please type your name">
            </div>
             <!-- name input -->

            <div class="form-group">
                <label for="address">Address</label>
                <input type="text" id="address" name="address" required placeholder="Please type your address">
            <!-- addressd input -->

            <div class="form-group">
                <label for="phone">Phone number</label>
                <input type="tel" id="phone" name="phone" required placeholder="Please type your 11 digits Chinese phone number">
            </div> 
            <!--phone number -->

            <div class="form-group">
                <label for="email">Emial address</address></label>
                <input type="email" id="email" name="email" required placeholder="Please type your email address">
            </div>
            <!-- email address -->

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required placeholder="You shall type at least 6 alphanumeric characters ">
            </div>
             <!-- username -->

             <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"  required placeholder="You shall type at least 6 alphanumeric characters">
            </div>
             <!-- password -->

              <div class="form-group">
                <label for="confirm your password">Confirm your password</label>
                <input type="password" id="repassword" name="confirm your password" required placeholder="Please type your password again">
            </div> 
            <!-- confirm password -->
                <button type="submit" class="submit-btn">You have finished registration</button>
             </form>
         </div>
    </div>

             <script>
                
                 function initPageEvents() {
           // buyer/seller switch
            const tabBtns = document.querySelectorAll('.tab-btn');
            tabBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    tabBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    //switch label form
                    const role = this.dataset.role;
                    document.querySelectorAll('.register-form').forEach(form => {
                        form.classList.remove('active');
                        //switch label demonstration
                    });
                    document.getElementById(`${role}Form`).classList.add('active');
                    
                });
            });
    
            document.getElementById('buyerForm').addEventListener('submit', function(e) {
                handleFormSubmit(e, 'buyer');
            });
            //submit function for buyer
            document.getElementById('sellerForm').addEventListener('submit', function(e) {
                handleFormSubmit(e, 'seller');
            });
            //submit function for seller

        }


             
             
             
             
             
             
             </script>









</body>






</html>
