<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car sale - Register</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
      /* initialize the layout */
      body {
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        /* make sure zooming in the page won't influence the display of the page */
        
         .container {
            width: 100%;
            max-width: 600px;
            background-color: whitesmoke;
            padding: 35px;
            border-radius: 12px;
        }
      /* style of main container */

      h1 {
            text-align: center;
            color: midnightblue;
            margin-bottom: 25px;
            font-size: 24px;
        }
        /* style of main title */

        .role-tabs {
            display: flex;
            border-bottom: 1px solid white;
        }
       
        .tab-btn {
            flex: 1;
            padding: 12px 0;
            border: none;
            background-color: white;
            cursor: pointer;
            font-size: 16px;
            color:dimgrey;
            transition: all 0.3s ease;
        }
        /* style of buttom title */

        .tab-btn.active {
            color: dodgerblue;
            border-bottom: 3px solid dodgerblue;
            font-weight: bold;
        }
        /* style of the button when it is clicked */
       
         .form-wrapper {
            padding: 30px;
        }

        /* when switching from the one to the other,former must be blocked */
        .register-form {
            display: none;
        }

       
        .register-form.active {
            display: block;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color:black;
            font-weight: 500;
            font-size: 14px;
        }
        /* style of form label */

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid white;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        /* style of form input*/

        .msg-tip.success {
            color: green
        }
         /* style of successful feedback */

        .error-tip {
            display: block;
            color:red;
            font-size: 12px;
            margin-top: 4px;
            min-height: 16px;
        }
         /* style of error feedback */

         .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

         .submit-btn {
            width: 100%;
            padding: 14px;
            background-color: dodgerblue;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .submit-btn:hover {
            background-color: dodgerblue; 
        }

        .submit-btn:disabled {
            background-color: lightgray;
            cursor: not-allowed;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Car sale - Register module</h1>

        <div class="tab-container">
            <button class="tab-btn active" data-role="buyer">Buyer</button>
            <button class="tab-btn" data-role="seller">Seller</button> 
        </div>
        <!-- buyer/seller switch button -->

        <div class="form-wrapper">
            <!-- for buyer -->
            <form class="register-form active" id="buyerForm">
                <div class="form-group">
                    <label for="buyer_name">Name</label>
                    <input type="text" id="buyer_name" name="name" required placeholder="Please type your name">
                </div>
                <!-- name input -->

                <div class="form-group">
                    <label for="buyer_address">Address</label>
                    <input type="text" id="buyer_address" name="address" required placeholder="Please type your address">
                </div>
                <!-- addressd input -->

                <div class="form-group">
                    <label for="buyer_phone">Phone number</label>
                    <input type="tel" id="buyer_phone" name="phone" required placeholder="Please type your 11 digits Chinese phone number">
                </div>
                <!--phone number -->

                <div class="form-group">
                    <label for="buyer_email">Emial address</label>
                    <input type="email" id="buyer_email" name="email" required placeholder="Please type your email address">
                </div>
                <!-- email address -->


                <div class="form-group">
                    <label for="buyer_username">Username</label>
                    <input type="text" id="buyer_username" name="username" required placeholder="You shall type at least 6 alphanumeric characters ">
                </div>
                <!-- username -->

                <div class="form-group">
                    <label for="buyer_password">Password</label>
                    <input type="password" id="buyer_password" name="password"  required placeholder="You shall type at least 6 alphanumeric characters">
                </div>
                <!-- password -->

                <div class="form-group">
                    <label for="buyer_repassword">Confirm your password</label>
                    <input type="password" id="buyer_repassword" name="repassword" required placeholder="Please type your password again">
                </div>   
            <!-- confirm password -->

                <button type="submit" class="submit-btn">You have finished registration</button>
            </form>

            <!-- for seller -->
            <form class="register-form" id="sellerForm">
                <div class="form-group">
                    <label for="seller_name">Name</label>
                    <input type="text" id="seller_name" name="name" required placeholder="Please type your name">
                </div>

                <div class="form-group">
                    <label for="seller_address">Address</label>
                    <input type="text" id="seller_address" name="address" required placeholder="Please type your address">
                </div>

                <div class="form-group">
                    <label for="seller_phone">Phone number</label>
                    <input type="tel" id="seller_phone" name="phone" required placeholder="Please type your 11 digits Chinese phone number">
                </div>

                <div class="form-group">
                    <label for="seller_email">Email address</label>
                    <input type="email" id="seller_email" name="email" required placeholder="Please type your email address">
                </div>

                <div class="form-group">
                    <label for="seller_username">Username</label>
                    <input type="text" id="seller_username" name="username" required placeholder="You shall type at least 6 alphanumeric characters ">
                </div>

                <div class="form-group">
                    <label for="seller_password">Password</label>
                    <input type="password" id="seller_password" name="password"  required placeholder="You shall type at least 6 alphanumeric characters">
                </div>

                <div class="form-group">
                    <label for="seller_repassword">Confirm your password</label>
                    <input type="password" id="seller_repassword" name="repassword" required placeholder="Please type your password again">
                </div>

                <button type="submit" class="submit-btn">You have finished registration</button>
            </form>
        </div>
    </div>

    <script>
        //initializing events
        function initPageEvents() {
            // buyer/seller switch
            const tabBtns = document.querySelectorAll('.tab-btn');
            tabBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                
                    tabBtns.forEach(b => b.classList.remove('active'));
                    // add active to button clicked
                    this.classList.add('active');
                    // get role
                    const role = this.dataset.role;
                    // hide all forms
                    document.querySelectorAll('.register-form').forEach(form => {
                        form.classList.remove('active');
                    });
                    // demonstrate role
                    const targetForm = document.getElementById(`${role}Form`);
                    if (targetForm) {
                        targetForm.classList.add('active');
                    }
                });
            });

           
            document.getElementById('buyerForm').addEventListener('submit', function(e) {
                handleFormSubmit(e, 'buyer');
            });
            document.getElementById('sellerForm').addEventListener('submit', function(e) {
                handleFormSubmit(e, 'seller');
            });
        }

        // form validating module
        function validateForm(formData, role) {
            // validate password
            if (formData.password !== formData.repassword) {
                alert('The password you type differs from the original!');
                return false;
            }

            
            const pwd = formData.password;
            const isSafe = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{6,}$/.test(pwd); 
            if (!isSafe) {
                alert('Password must contain at least 6 alphanumeric characters');
                return false;
            }

            const phoneReg = /^1[3-9]\d{9}$/;
            if (!phoneReg.test(formData.phone)) {
                alert('Please type valid Chinese phone number！');
                return false;
            }

            return true;
        }

        // form submitting
        async function handleFormSubmit(e, role) {
            e.preventDefault(); 
            const form = document.getElementById(`${role}Form`);
            const submitBtn = form.querySelector('.submit-btn');
            
            // avoid submitting twice
            submitBtn.disabled = true;
            submitBtn.textContent = 'Registering...';

            // collect form data
            const formData = new FormData(form);
            const userData = {};
            formData.forEach((value, key) => {
                userData[key] = value;
            });

            // 验证表单
            const isValid = validateForm(userData, role);
            if (!isValid) {
                submitBtn.disabled = false;
                submitBtn.textContent = 'You have finished registration';
                return;
            }

            // stimulate making a request to the back end
            try {
                alert(`✅ ${role} registration success!`);
                form.reset(); // 重置表单
            } catch (error) {
                alert('❌ Registration failed!');
                console.error('Registration error:', error);
            } finally {
               
                submitBtn.disabled = false;
                submitBtn.textContent = 'You have finished registration';
            }
        }
        
        window.onload = function() {
            initPageEvents();
        }
    </script>
</body>
</html>
