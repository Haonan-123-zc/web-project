<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car sale - Log in</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
      /* initialize the layout */
      body {
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        /* make sure zooming in the page won't influence the display of the page */
        
         .container {
            width: 100%;
            max-width: 600px;
            background-color: whitesmoke;
            padding: 35px;
            border-radius: 12px;
        }
      /* style of main container */

      h1 {
            text-align: center;
            color: midnightblue;
            margin-bottom: 25px;
            font-size: 24px;
        }
        /* style of main title */

        .tab-btn {
            flex: 1;
            padding: 12px 0;
            border: none;
            background-color: white;
            cursor: pointer;
            font-size: 16px;
            color:dimgrey;
            transition: all 0.3s ease;
        }
        /* style of buttom title */

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color:black;
            font-weight: 500;
            font-size: 14px;
        }
        /* style of form label */

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d9d9d9;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        /* style of form input*/

        .error-tip {
            display: block;
            color:red;
            font-size: 12px;
            margin-top: 4px;
            min-height: 16px;
        }
         /* style of error feedback */

         .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }





    </style>

</head>

<body>
    <div class="container">
        <h1>Car sale - Log in module</h1>

        <div class="tab-container">
            <button class="tab-btn active" data-type="buyer">Buyer</button>
            <button class="tab-btn" data-type="seller">Seller</button>
        </div>
        <!-- buyer/seller switch button -->

         <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required placeholder="Please type your name（alphabetical letters and space only）">
                <span class="error-tip" id="nameError"></span>
            </div>
             <!-- name input -->

            <div class="form-group">
                <label for="address">地址</label>
                <input type="text" id="address" name="address" required placeholder="Please type your address（alphanumeric characters and space only）">
                <span class="error-tip" id="addressError"></span>
            </div>
            <!-- addressd input -->

            <div class="form-group">
                <label for="phone">Phone number</label>
                <input type="tel" id="phone" name="phone" required placeholder="Please type your 11 digits Chinese phone number">
                <span class="error-tip" id="phoneError"></span>
            </div> 
            <!--phone number -->

            <div class="form-group">
                <label for="email">Emial address</address></label>
                <input type="email" id="email" name="email" required placeholder="Please type your email address (must must end either .cn, and .com and must contain the character @ exactly once.)">
                <span class="error-tip" id="emailError"></span>
            </div>
            <!-- email address -->

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required placeholder="You shall type at least 6 alphanumeric characters and alphanumeric characters only">
                <span class="error-tip" id="usernameError"></span>
            </div>
             <!-- username -->

             <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="You shall type at least 6 alphanumeric characters and alphanumeric characters only">
                <span class="error-tip" id="passwordError"></span>
            </div>
             <!-- password -->












</body>






</html>
