<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car sale - Log in</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
      /* initialize the layout */
      body {
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        /* make sure zooming in the page won't influence the display of the page */
        
         .container {
            width: 100%;
            max-width: 600px;
            background-color: whitesmoke;
            padding: 35px;
            border-radius: 12px;
        }
      /* style of main container */

      h1 {
            text-align: center;
            color: midnightblue;
            margin-bottom: 25px;
            font-size: 24px;
        }
        /* style of main title */

        .tab-btn {
            flex: 1;
            padding: 12px 0;
            border: none;
            background-color: white;
            cursor: pointer;
            font-size: 16px;
            color:dimgrey;
            transition: all 0.3s ease;
        }
        /* style of buttom title */

        .form-group {
            margin-bottom: 18px;
        }

        


    </style>

</head>

<body>
    <div class="container">
        <h1>Car sale - Log in module</h1>

        <div class="tab-container">
            <button class="tab-btn active" data-type="buyer">Buyer</button>
            <button class="tab-btn" data-type="seller">Seller</button>
        </div>
        <!-- buyer/seller switch button -->

         <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required placeholder="Please type your name（alphabetical letters and space only）">
                <span class="error-tip" id="nameError"></span>
            </div>
             <!-- name input module -->

            <div class="form-group">
                <label for="address">地址</label>
                <input type="text" id="address" name="address" required placeholder="Please type your address（alphanumeric characters and space only）">
                <span class="error-tip" id="addressError"></span>
            </div>
            <!-- addressd input module -->







</body>






</html>
